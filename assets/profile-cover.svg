<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Jacob J. — digital products that work</title>
  <desc id="desc">Editorial cover with cobalt particles and a statement about building useful digital products.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#111111" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#1457ff"/>
      <circle cx="10" cy="9" r="1.15" fill="#8cb4ff"/>
    </pattern>
    <mask id="particle-curve">
      <rect width="1200" height="480" fill="black"/>
      <path d="M770 -60C1120 35 821 176 1074 270C1248 334 1085 472 831 551" fill="none" stroke="white" stroke-width="170" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="1200" height="480" fill="#f2efe8"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect width="1200" height="480" fill="url(#dots)" mask="url(#particle-curve)" opacity=".9"/>

  <circle cx="62" cy="60" r="5" fill="#1457ff"/>
  <text x="84" y="66" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">01 / PROFILE</text>
  <text x="1058" y="66" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">JACOB J.</text>
  <circle cx="1150" cy="60" r="5" fill="#1457ff"/>

  <text x="60" y="186" fill="#050505" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Complex problems.</text>
  <text x="60" y="263" fill="#050505" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Digital products</text>
  <rect x="58" y="284" width="392" height="82" fill="#1457ff"/>
  <text x="78" y="345" fill="#f8f5ee" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">that work.</text>

  <text x="60" y="428" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">FULL-STACK DEVELOPMENT · AUTOMATION · DIGITAL PRODUCT</text>
  <text x="953" y="428" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">SPAIN / REMOTE</text>
</svg>
